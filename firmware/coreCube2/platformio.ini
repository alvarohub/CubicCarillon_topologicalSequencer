; PlatformIO project for the CoreS3 "coreCube2" sequence-first firmware.
; Build:   pio run -e cores3
; Upload:  pio run -e cores3 -t upload   (replaces what runs on the board)
; Monitor: pio device monitor -b 115200

[platformio]
default_envs = cores3

[env:cores3]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200

; C++17: the ESP32 Arduino core defaults to C++11, but this firmware uses
; C++17 features. The frame-size warning (any function needing more than
; 2 KB of stack is flagged) is how the "reset in place" pattern
; (Sequencer::reset) keeps multi-KB temporaries off the ESP32's small task
; stacks. On clean builds the same warning also appears from M5GFX's unused
; compression code — that is a dependency, not this firmware.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wframe-larger-than=2048

; Pinned versions: reproducible builds. Bump deliberately, not implicitly.
lib_deps =
  m5stack/M5Unified@0.2.18
  adafruit/Adafruit NeoMatrix@1.3.3
  adafruit/Adafruit NeoPixel@1.15.5
  adafruit/Adafruit GFX Library@1.12.6
  bblanchon/ArduinoJson@6.21.6